# Alternativa ao MySQL instalado na máquina: docker compose up -d
name: vvs-grupo02-produtos
services:
  mysql:
    image: mysql:8.0
    container_name: bd_produtos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd_produtos
      MYSQL_USER: aluno_unifio
      MYSQL_PASSWORD: abc123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
